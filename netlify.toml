[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "upgrade-insecure-requests; block-all-mixed-content"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/SpinZo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"


# 301 redirects: dropped intersection pages → parent area page
# These pages were generated for 6 areas × 8 services (48 pages) but we now
# build only 4 core areas × 3 intersection services (12 pages).
# Google had 39 of the original 48 "Discovered – not indexed" — the redirect
# consolidates link equity and removes the content-similarity penalty.

# Areas removed from CORE_SERVICE_AREAS entirely — redirect all service links
[[redirects]]
  from = "/locations/jayanagar/:service"
  to = "/locations/jayanagar"
  status = 301
  force = true

[[redirects]]
  from = "/locations/jp-nagar/:service"
  to = "/locations/jp-nagar"
  status = 301
  force = true

[[redirects]]
  from = "/locations/bellandur/:service"
  to = "/locations/bellandur"
  status = 301
  force = true

